profile: go-fullstack
version: 17.0.0
local_development:
  runtime: native
  backend: go
  frontend: vite-react
  database: postgresql
  worktrees:
    isolation: [database, ports, logs, e2e-artifacts]
    e2e: local-background
architecture:
  style: modular-monolith
  contracts: protobuf-buf-connect
  desktop: wails3
  mobile: native-if-wails-mobile-unfit
production:
  primary: vm-docker-compose
  secondary: kubernetes
skills:
  addyosmani: curated-with-full-references
  graphify: local-graph
  orca: user-global

engineering:
  workflow: sequential-sdd
  artifact_format: markdown-yaml-frontmatter
  team_size: 1-5
  task_source: markdown
  merge_gate: product-ci-and-protected-branch
