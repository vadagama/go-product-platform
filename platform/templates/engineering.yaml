# Инженерный профиль продукта (глава 20 руководства): единственное место
# фиксации состава набора — навыков, агентов и референсов с источниками и
# ревизиями проектных копий. Ведёт агент при каждой установке или обновлении;
# изменения согласуются в чате. Для не-Git источника фиксируйте версию или
# дату снимка с контрольной суммой; ревизии описывают проектные копии и не
# меняются от глобального обновления. Версии CLI Graphify и Orca — в MANUAL.md.
schema_version: "1.0"
platform:
  source: "go-product-platform"
  revision: "<git-sha ревизии платформы>"
profile: "<go-api | web | desktop | mobile-native | ai | custom>"
policy:
  file: "docs/agent-policy.md"
skills:
  - name: "go-platform-bootstrap"
    source: "<репозиторий платформы>"
    revision: "<SHA>"
    paths: [".agents/skills/go-platform-bootstrap/", ".claude/skills/go-platform-bootstrap/"]
    purpose: "настройка платформы"
    status: "current"
  # Добавляйте записи по факту установки: базовые навыки, процесс,
  # профильные дополнения, Orca, canvas и другие согласованные навыки.
  # Удалённые навыки убирайте; решение фиксируйте в комментарии коммита.
